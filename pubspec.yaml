name: bodycount
description: "BodyCount — Répertoire personnel de rencontres"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Database
  sqflite: ^2.4.2
  path_provider: ^2.1.5

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Charts
  fl_chart: ^0.70.2

  # Map
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Auth
  local_auth: ^2.3.0

  # Images
  image_picker: ^1.1.2
  photo_view: ^0.15.0

  # Utils
  intl: ^0.20.2
  path: ^1.9.1
  archive: ^4.0.4
  share_plus: ^10.1.4
  uuid: ^4.5.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
