name: bodycount
description: "BodyCount — Répertoire personnel de rencontres"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Base de données chiffrée (SQLCipher)
  sqflite_sqlcipher: ^3.1.0+1
  path_provider: ^2.1.5

  # Chiffrement
  flutter_secure_storage: ^9.2.4
  cryptography: ^2.7.0
  # AES-GCM natif d'Android, pour chiffrer les vidéos sans y passer la minute
  cryptography_flutter: ^2.3.4

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Auth
  local_auth: ^2.3.0

  # Images
  image_picker: ^1.1.2
  video_player: ^2.14.0

  # Utils
  intl: ^0.20.2
  path: ^1.9.1
  archive: ^4.0.4
  share_plus: ^10.1.4
  uuid: ^4.5.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/demo/
    - assets/carte/

  # Chakra Petch, sous licence SIL Open Font, embarquée plutôt que
  # chargée : une police prise sur le réseau serait une requête de plus,
  # et il n'y en a aucune dans cette application.
  fonts:
    - family: ChakraPetch
      fonts:
        - asset: assets/fonts/ChakraPetch-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ChakraPetch-Bold.ttf
          weight: 700

