<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300"
     viewBox="0 0 1280 300" role="img"
     aria-label="A 20 MB video shot in 1080p is re-encoded by Media3 on the phone encoder: H.264, 720 points on the short side, 2.5 Mb/s. It comes out at 3 MB and enters the vault, encrypted in chunks. The lighter version is only kept if it saves at least a tenth.">
  <rect width="1280" height="300" fill="#0D1117"/>
  <path d="M 250 140 H 1040" stroke="#2F3A47" stroke-width="1.8" fill="none"/>
  
  <g>
    <circle r="7" fill="#E879F9" opacity="0"><animateMotion dur="7s" repeatCount="indefinite"
        path="M 250 140 H 1040" keyPoints="0;0;1;1" keyTimes="0;0.0429;0.7429;1"
        calcMode="linear"/>
      <animate attributeName="opacity" dur="7s" repeatCount="indefinite"
             values="0;0;0.18;0.18;0;0"
             keyTimes="0;0.0429;0.0786;0.7071;0.7429;1"/></circle>
    <circle r="3" fill="#FFFFFF" opacity="0"><animateMotion dur="7s" repeatCount="indefinite"
        path="M 250 140 H 1040" keyPoints="0;0;1;1" keyTimes="0;0.0429;0.7429;1"
        calcMode="linear"/>
      <animate attributeName="opacity" dur="7s" repeatCount="indefinite"
             values="0;0;1;1;0;0"
             keyTimes="0;0.0429;0.0786;0.7071;0.7429;1"/></circle>
  </g>

  
  <g>
    <rect x="56" y="104" width="194" height="72" rx="11"
          fill="#131A24" stroke="#1F2833" stroke-width="1"/>
    <rect x="56" y="116" width="3" height="48" rx="1.5"
          fill="#E879F9" opacity="1"/>
    <text x="76" y="135" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace"
          font-size="13.5" font-weight="600" fill="#F0F4F8">recorded video</text>
    <text x="76" y="155" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"
          font-size="12" fill="#8B99A8">1080p · 16 Mb/s</text>
  </g>
  <rect x="80" y="194" width="146" height="12" rx="6" fill="#E879F9" opacity="0.8"/>
  <text x="153" y="228" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="13"
        font-weight="600" fill="#F0F4F8">20 Mo</text>

  
  <g>
    <rect x="470" y="104" width="230" height="72" rx="11"
          fill="#131A24" stroke="#1F2833" stroke-width="1"/>
    <rect x="470" y="116" width="3" height="48" rx="1.5"
          fill="#E879F9" opacity="0.8"/>
    <text x="490" y="135" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace"
          font-size="13.5" font-weight="600" fill="#F0F4F8">Media3 Transformer</text>
    <text x="490" y="155" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"
          font-size="12" fill="#8B99A8">phone encoder</text>
  </g>
  <rect x="495" y="194" width="180" height="6" rx="3" fill="#1F2833"/>
  <rect x="495" y="194" width="0" height="6" rx="3" fill="#E879F9">
    <animate attributeName="width" dur="7s" repeatCount="indefinite"
             values="0;0;180;180;0" keyTimes="0;0.2000;0.5143;0.9429;1"/>
  </rect>
  <text x="585" y="228" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="12"
        fill="#8B99A8">H.264 · 720p · 2,5 Mb/s</text>

  
  <g>
    <rect x="1040" y="104" width="184" height="72" rx="11"
          fill="#131A24" stroke="#1F2833" stroke-width="1"/>
    <rect x="1040" y="116" width="3" height="48" rx="1.5"
          fill="#E879F9" opacity="0.5"/>
    <text x="1060" y="135" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace"
          font-size="13.5" font-weight="600" fill="#F0F4F8">into the vault</text>
    <text x="1060" y="155" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"
          font-size="12" fill="#8B99A8">chunk-encrypted</text>
  </g>
  <g opacity="0"><animate attributeName="opacity" dur="7s" repeatCount="indefinite"
             values="0;0;1;1;0;0"
             keyTimes="0;0.5429;0.5786;0.9357;0.9714;1"/>
    <rect x="1064" y="194" width="146" height="12" rx="6" fill="#1F2833"/>
    <rect x="1064" y="194" width="22" height="12" rx="6" fill="#4ADE80"/>
    <text x="1137" y="228" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace" font-size="13"
          font-weight="600" fill="#4ADE80">3 Mo</text>
  </g>

  <text x="640" y="272" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"
        font-size="12.5" fill="#5C6A7A">Re-encoding always costs a little: the lighter version is only kept if it saves at least a tenth, otherwise the original goes in as it is.</text>
</svg>
