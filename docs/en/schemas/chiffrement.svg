    <g clip-path="url(#doigt)">
      <rect x="-16" y="-16" width="32" height="7" fill="#FFFFFF" opacity="0.9">
        <animate attributeName="y" dur="2.8s" repeatCount="indefinite"
                 values="-22;16;16" keyTimes="0;0.6;1"/>
      </rect>
    </g>
  </g>
  <text x="91" y="228" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"
        font-size="11.5" fill="#5C6A7A">fingerprint</text>

  
  <g>
    <rect x="190" y="134" width="214" height="72" rx="11"
          fill="#131A24" stroke="#1F2833" stroke-width="1"/>
    <rect x="190" y="146" width="3" height="48" rx="1.5"
          fill="#E879F9" opacity="1"/>
    <text x="210" y="165" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace"
          font-size="13.5" font-weight="600" fill="#F0F4F8">Android Keystore</text>
    <text x="210" y="185" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"
          font-size="12" fill="#8B99A8">master key, 256 bits</text>
  </g>
  
  <g>
    <rect x="464" y="134" width="200" height="72" rx="11"
          fill="#131A24" stroke="#1F2833" stroke-width="1"/>
    <rect x="464" y="146" width="3" height="48" rx="1.5"
          fill="#E879F9" opacity="0.8"/>
    <text x="484" y="165" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace"
          font-size="13.5" font-weight="600" fill="#F0F4F8">HKDF-SHA256</text>
    <text x="484" y="185" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"
          font-size="12" fill="#8B99A8">two derived keys</text>
  </g>

  
  <g>
    <rect x="730" y="52" width="258" height="72" rx="11"
          fill="#131A24" stroke="#1F2833" stroke-width="1"/>
    <rect x="730" y="64" width="3" height="48" rx="1.5"
          fill="#E879F9" opacity="0.6"/>
    <text x="750" y="83" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace"
          font-size="13.5" font-weight="600" fill="#F0F4F8">bodycount/db/v1</text>
    <text x="750" y="103" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"
          font-size="12" fill="#8B99A8">SQLCipher password</text>
  </g>
  
  <g>
    <rect x="730" y="216" width="258" height="72" rx="11"
          fill="#131A24" stroke="#1F2833" stroke-width="1"/>
    <rect x="730" y="228" width="3" height="48" rx="1.5"
          fill="#E879F9" opacity="0.6"/>
    <text x="750" y="247" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace"
          font-size="13.5" font-weight="600" fill="#F0F4F8">bodycount/photos/v1</text>
    <text x="750" y="267" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"
          font-size="12" fill="#8B99A8">AES-GCM key</text>
  </g>

  
  <g>
    <rect x="1044" y="52" width="180" height="72" rx="11"
          fill="#131A24" stroke="#1F2833" stroke-width="1"/>
    <rect x="1044" y="64" width="3" height="48" rx="1.5"
          fill="#E879F9" opacity="0.4"/>
    <text x="1064" y="83" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace"
          font-size="13.5" font-weight="600" fill="#F0F4F8">journal.db</text>
    <text x="1064" y="103" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"
          font-size="12" fill="#8B99A8">encrypted at rest</text>
  </g>
  
  <g>
    <rect x="1044" y="216" width="180" height="72" rx="11"
          fill="#131A24" stroke="#1F2833" stroke-width="1"/>
    <rect x="1044" y="228" width="3" height="48" rx="1.5"
          fill="#E879F9" opacity="0.4"/>
    <text x="1064" y="247" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace"
          font-size="13.5" font-weight="600" fill="#F0F4F8">vault/</text>
    <text x="1064" y="267" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"
          font-size="12" fill="#8B99A8">photos and videos</text>
  </g>

  <text x="640" y="322" text-anchor="middle" font-family="system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif"
        font-size="12.5" fill="#5C6A7A">None of this chain exists in memory before the fingerprint.</text>
</svg>
