<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="392"
     viewBox="0 0 1280 392" role="img"
     aria-label="Trois écrans demandent la base au même instant, au déverrouillage. Ils attendent tous la même ouverture, qui ouvre un seul fichier chiffré. Avant la correction, chacun lançait la sienne, et l'application finissait avec deux connexions sur deux fichiers différents.">
  <rect width="1280" height="392" fill="#0D1117"/>
  <path d="M 280 54 C 380 54 420 170 520 170" stroke="#2F3A47" stroke-width="1.8" fill="none"/>
