    <rect x="56" y="30" width="3" height="48" rx="1.5"
          fill="#E879F9" opacity="0.5"/>
    <text x="76" y="49" font-family="ui-monospace,SFMono-Regular,SF Mono,Menlo,Consolas,monospace"
